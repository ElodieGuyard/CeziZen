<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="fr">

<head>
    <title>CESI ZEN Error Page</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/CSS/styles.css}">
</head>
<header>
    <div th:replace="fragments/navFragment :: nav"></div>
</header>
<body>
<div>
    <h1>Oups ! Une erreur est survenue</h1>
    <p>
        <strong>Code d'erreur : </strong>
        <span th:text="${status}">500</span>
    </p>
    <p>
        <strong>Message : </strong>
        <span th:text="${error} ?: 'Erreur inconnue'">Erreur inconnue</span>
    </p>
    <p th:if="${message != null and !message.isEmpty()}">
        <strong>Détails : </strong>
        <span th:text="${message}">Détails de l'erreur</span>
    </p>
    <a th:href="@{/}">Retour à l'accueil</a>
</div>
<script th:src="@{/JS/scripts.js}"></script>
</body>
</html>
