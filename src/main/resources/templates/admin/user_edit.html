<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Modifier utilisateur</title>
</head>
<body>

<h1>Modifier utilisateur</h1>

<p>
    Utilisateur :
    <strong th:text="${user.name}">nom</strong>
    (id=<span th:text="${user.id}">1</span>)
</p>

<form th:action="@{'/admin/users/' + ${user.id} + '/edit'}" method="post">

    <div>
        <label>Rôle :</label>
        <select name="role">
            <option th:each="r : ${roles}"
                    th:value="${r}"
                    th:text="${r}"
                    th:selected="${r} == ${user.role}">
            </option>
        </select>
    </div>

    <div>
        <label>
            <input type="checkbox" name="enabled" th:checked="${user.enabled}">
            Compte actif
        </label>
    </div>


    <button type="submit">Enregistrer</button>
</form>

    <form th:action="@{/admin/users/{id}/delete(id=${user.id})}" method="post" style="display:inline">
        <button type="submit" onclick="return confirm('Supprimer cet utilisateur ?')">Supprimer</button>
    </form>

<p><a th:href="@{/admin/users}">Retour liste</a></p>

</body>
</html>
