<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <title>Admin - Ressources</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/CSS/styles.css}">
</head>
<body>
<header>
    <div th:replace="fragments/navFragment :: nav"></div>
</header>

<div class="main-container">
    <h1>Liste des ressources</h1>

    <p>
        <a th:href="@{/admin/ressources/new}">+ Créer une ressource</a>
        &nbsp;|&nbsp;
        <a th:href="@{/admin/dashboard}">Retour dashboard</a>
    </p>

    <ul>
        <li th:each="res : ${ressources}">
            <strong th:text="${res.type}">Type</strong>
            -
            <span th:text="${res.titre}">Titre</span>
            -
            <span th:text="${res.categorie != null ? res.categorie.nom : 'Sans catégorie'}">Cat</span>

            &nbsp;|&nbsp;
            <a th:href="@{/ressources/{id}(id=${res.id})}">Voir (public)</a>

            &nbsp;|&nbsp;
            <a th:href="@{/admin/ressources/{id}/edit(id=${res.id})}">Modifier</a>

            &nbsp;|&nbsp;
            <form th:action="@{/admin/ressources/{id}/delete(id=${res.id})}" method="post" style="display:inline">
                <button type="submit" onclick="return confirm('Supprimer cette ressource ?')">Supprimer</button>
            </form>
        </li>
    </ul>
</div>

<script th:src="@{/JS/scripts.js}"></script>
</body>
</html>
