services :
  mysql_db:
    image: mysql:8.0.45
    command: --default-authentication-plugin=mysql_native_password
    container_name: mysql_cz
    restart: always
    environment:
      MYSQL_DATABASE: cesizen
      MYSQL_ROOT_PASSWORD: exampleRootPwd
      MYSQL_USER: exampleUsr
      MYSQL_PASSWORD: examplePwd
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL","mysql --user=exampleUsr --password=examplePwd --execute=\"SHOW DATABASES;\""]
      interval: 5s
      timeout: 5s
      retries: 20

  flyway:
    image: flyway/flyway
    command: -url=jdbc:mysql://mysql_db:3306/cesizen -user=exampleUsr -password=examplePwd -connectRetries=60 migrate
    container_name: flyway_cz
    volumes:
      - ./sql:/flyway/sql:ro
    depends_on:
      mysql_db:
        condition: service_healthy

volumes:
  mysql_data: